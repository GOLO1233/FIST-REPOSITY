<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOLO Client — Eaglercraft 1.8.8</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050509;color:#fff;font-family:Arial,sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}#boot{position:fixed;inset:0;display:grid;place-items:center;background:#07070c;z-index:20}.card{width:min(560px,92vw);padding:28px;border:1px solid #33364a;border-radius:18px;background:#10111aee;box-shadow:0 25px 80px #000}.logo{font-size:34px;font-weight:900;letter-spacing:4px}.logo b{color:#8a6cff}.muted{color:#9aa1b8;margin:10px 0 22px;line-height:1.5}.btn{border:0;border-radius:10px;padding:12px 18px;background:#7c5cff;color:#fff;font-weight:800;cursor:pointer}.btn:hover{background:#9278ff}#hud{position:fixed;left:14px;top:14px;z-index:10;pointer-events:none;text-shadow:0 2px 5px #000}.brand{font-weight:900;letter-spacing:2px}.brand b{color:#8a6cff}.stats{font-size:12px;color:#d6d9e5;margin-top:5px}#array{position:fixed;right:14px;top:14px;z-index:12;text-align:right;pointer-events:none}.tag{display:block;margin:0 0 5px;padding:5px 8px;border:1px solid #373b50;border-radius:6px;background:#0b0c12dd;color:#d7cdff;font-size:12px}#gui{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,94vw);height:min(560px,82vh);display:none;z-index:30;background:#0d0f16f7;border:1px solid #34394e;border-radius:16px;box-shadow:0 30px 100px #000d,0 0 40px #7c5cff25;backdrop-filter:blur(12px)}#side{width:190px;padding:18px;border-right:1px solid #292d3d;background:#0a0c12dd}.brand2{font-size:21px;font-weight:900;margin:3px 6px 20px}.brand2 b{color:#8a6cff}.cat{display:block;width:100%;border:0;background:transparent;color:#9299af;padding:10px 12px;text-align:left;border-radius:8px;margin:3px 0;cursor:pointer}.cat.active,.cat:hover{background:#7c5cff1c;color:#fff}.content{flex:1;padding:23px;overflow:auto}.title{font-size:24px;font-weight:900}.sub{color:#8f96ab;margin:5px 0 18px}.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mod{border:1px solid #292d3d;background:#11131c;border-radius:11px;padding:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.mod.on{border-color:#7159d9;background:#17152a}.name{font-weight:800}.desc{font-size:11px;color:#858ca2;margin-top:4px}.sw{width:35px;height:20px;border-radius:20px;background:#2a2e3c;padding:3px}.sw i{display:block;width:14px;height:14px;border-radius:50%;background:#747b90}.on .sw{background:#7c5cff}.on .sw i{background:#fff;transform:translateX(15px)}#close{position:absolute;right:15px;top:13px;border:0;background:transparent;color:#9aa1b8;font-size:24px;cursor:pointer}@media(max-width:650px){#side{width:135px;padding:10px}.content{padding:15px}.mods{grid-template-columns:1fr}}
</style>
</head>
<body>
<iframe id="game" title="Eaglercraft 1.8.8"></iframe>
<div id="boot"><div class="card"><div class="logo">GOLO <b>CLIENT</b></div><div class="muted">Eaglercraft 1.8.8 launcher с клиентским HUD и ClickGUI. Нажми кнопку, чтобы загрузить игру.</div><button class="btn" id="start">ЗАПУСТИТЬ EAGLERCRAFT</button></div></div>
<div id="hud"><div class="brand">GOLO <b>CLIENT</b></div><div class="stats">FPS <span id="fps">--</span> · 1.8.8 · Right Shift — ClickGUI</div></div>
<div id="array"></div>
<section id="gui"><aside id="side"><div class="brand2">GOLO <b>CLIENT</b></div><div id="cats"></div></aside><main class="content"><button id="close">×</button><div class="title" id="title">Visual</div><div class="sub">Client-side HUD / interface modules</div><div class="mods" id="mods"></div></main></section>
<script>
const GAME_URL='https://wafffles.github.io/Eaglercraft1.8.8/';
const data={Visual:[['HUD','FPS и версия клиента'],['ArrayList','Список включённых модулей'],['Crosshair','Кастомный прицел']],Client:[['FPS','Счётчик кадров'],['ClickGUI','Окно настроек']],Player:[['Keystrokes','WASD / Space / Shift']],Movement:[['Sprint','Клиентский спринт']],Combat:[['CPS','Счётчик кликов']]};
const enabled=new Set(['HUD','FPS','ClickGUI']);let current='Visual';
const gui=document.getElementById('gui'),mods=document.getElementById('mods'),cats=document.getElementById('cats'),title=document.getElementById('title'),array=document.getElementById('array');
Object.keys(data).forEach(c=>{let b=document.createElement('button');b.className='cat';b.textContent=c;b.onclick=()=>select(c,b);cats.appendChild(b)});
function select(c,b){current=c;title.textContent=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function render(){mods.innerHTML='';data[current].forEach(([n,d])=>{let e=document.createElement('div');e.className='mod '+(enabled.has(n)?'on':'');e.innerHTML='<div><div class="name">'+n+'</div><div class="desc">'+d+'</div></div><div class="sw"><i></i></div>';e.onclick=()=>{enabled.has(n)?enabled.delete(n):enabled.add(n);render()};mods.appendChild(e)});array.innerHTML=[...enabled].map(x=>'<span class="tag">'+x+'</span>').join('')}
function toggle(){gui.style.display=gui.style.display==='flex'?'none':'flex'}
document.addEventListener('keydown',e=>{if(e.code==='ShiftRight'){e.preventDefault();toggle()}});document.getElementById('close').onclick=toggle;document.querySelector('.cat').click();
document.getElementById('start').onclick=()=>{document.getElementById('game').src=GAME_URL;document.getElementById('boot').style.display='none'};
let frames=0,last=performance.now();function tick(){frames++;let n=performance.now();if(n-last>=1000){document.getElementById('fps').textContent=frames;frames=0;last=n}requestAnimationFrame(tick)}tick();
</script>
</body>
</html>
