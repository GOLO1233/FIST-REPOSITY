<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOLO Client — ClickGUI</title>
<style>
:root{--bg:#090a0f;--panel:#10121a;--panel2:#151824;--line:#252a3a;--text:#f5f7ff;--muted:#8e96ad;--accent:#7c5cff;--accent2:#9a83ff;--green:#55e6a5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#1a1530 0,#090a0f 55%);color:var(--text);font:14px Arial,sans-serif;min-height:100vh;overflow:hidden}
#hint{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#9da5bd;background:#0c0e15dd;border:1px solid var(--line);padding:8px 12px;border-radius:9px;z-index:5}
#gui{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(920px,94vw);height:min(570px,82vh);display:flex;background:#0d0f16f5;border:1px solid #30354a;border-radius:16px;box-shadow:0 25px 80px #000b,0 0 35px #7c5cff22;backdrop-filter:blur(14px)}
.sidebar{width:190px;padding:18px;border-right:1px solid var(--line);background:#0b0d13cc}.brand{font-size:22px;font-weight:900;letter-spacing:2px;margin:3px 6px 22px}.brand b{color:var(--accent2)}
.cat{width:100%;border:0;background:transparent;color:var(--muted);padding:11px 12px;text-align:left;border-radius:9px;margin:3px 0;cursor:pointer}.cat:hover,.cat.active{background:#7c5cff1b;color:white}.cat.active{box-shadow:inset 2px 0 var(--accent)}
.content{flex:1;padding:24px;overflow:auto}.title{font-size:24px;font-weight:800}.sub{color:var(--muted);margin:5px 0 20px}.modules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.module{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:.15s}.module:hover{border-color:#4b536d;transform:translateY(-1px)}.module.on{border-color:#6f59d9;background:#17152a}.name{font-weight:700}.desc{font-size:11px;color:var(--muted);margin-top:4px}.switch{width:34px;height:19px;border-radius:20px;background:#292d3a;padding:3px}.switch i{display:block;width:13px;height:13px;border-radius:50%;background:#747b91;transition:.15s}.on .switch{background:var(--accent)}.on .switch i{background:white;transform:translateX(15px)}
.array{position:fixed;right:14px;top:14px;text-align:right}.array div{display:inline-block;margin-bottom:5px;background:#0b0d13e8;border:1px solid var(--line);padding:5px 8px;border-radius:6px;color:#cfc7ff}
#gui.hidden{display:none}@media(max-width:650px){.sidebar{width:135px;padding:10px}.content{padding:15px}.modules{grid-template-columns:1fr}.brand{font-size:17px}}
</style>
</head>
<body>
<div id="hint">Right Shift — открыть/закрыть ClickGUI</div>
<div id="array" class="array"></div>
<section id="gui">
<aside class="sidebar"><div class="brand">GOLO <b>CLIENT</b></div><div id="cats"></div></aside>
<main class="content"><div class="title" id="title">Visual</div><div class="sub">Client-side modules · 1.8.8</div><div class="modules" id="modules"></div></main>
</section>
<script>
const data={Visual:[['HUD','FPS, координаты и аккуратный HUD'],['Keystrokes','WASD + Space + Shift'],['Crosshair','Настраиваемый прицел'],['ArrayList','Список активных модулей']],Client:[['FPS','Счётчик кадров'],['ClickGUI','Настройки интерфейса']],Player:[['Sprint','Управление спринтом']],Movement:[['Zoom','Клиентский зум']],Combat:[['CPS','Счётчик кликов']]};
const enabled=new Set(['HUD','FPS']);let current='Visual';
const cats=document.getElementById('cats'),mods=document.getElementById('modules'),title=document.getElementById('title'),array=document.getElementById('array'),gui=document.getElementById('gui');
Object.keys(data).forEach(c=>{const b=document.createElement('button');b.className='cat';b.textContent=c;b.onclick=()=>select(c,b);cats.appendChild(b)});
function select(c,button){current=c;title.textContent=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));button.classList.add('active');render()}
function render(){mods.innerHTML='';data[current].forEach(([name,desc])=>{const el=document.createElement('div');el.className='module '+(enabled.has(name)?'on':'');el.innerHTML=`<div><div class="name">${name}</div><div class="desc">${desc}</div></div><div class="switch"><i></i></div>`;el.onclick=()=>{enabled.has(name)?enabled.delete(name):enabled.add(name);render();renderArray()};mods.appendChild(el)});renderArray()}
function renderArray(){array.innerHTML=[...enabled].map(x=>`<div>${x}</div>`).join('')}
document.addEventListener('keydown',e=>{if(e.code==='ShiftRight'){gui.classList.toggle('hidden');e.preventDefault()}});
document.querySelector('.cat').click();
</script>
</body>
</html>
