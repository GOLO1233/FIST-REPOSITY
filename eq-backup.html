<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse Music — EQ Backup</title><style>body{margin:0;background:#09080d;color:#fff;font:16px system-ui;padding:24px}main{max-width:700px;margin:auto;background:#14111b;border:1px solid #30283d;border-radius:22px;padding:24px}h1{margin-top:0}button,label{display:inline-block;padding:12px 16px;margin:6px 4px 6px 0;border-radius:11px;border:1px solid #443957;background:#8b5cf6;color:#fff;font-weight:700;cursor:pointer}input{display:none}.status{margin-top:18px;color:#aaa}.bands{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.band{background:#0e0c13;padding:10px;border-radius:10px;text-align:center}.back{background:#211c2c}</style><main><h1>🎚️ Pulse Music — EQ Backup</h1><p>Сохрани свою имбу в JSON-файл. Файл можно потом импортировать обратно.</p><div id="bands" class="bands"></div><button id="save">💾 Сохранить EQ в файл</button><label>📂 Загрузить EQ<input id="load" type="file" accept="application/json,.json"></label><a class="back" href="./">← Вернуться в Pulse Music</a><div id="status" class="status"></div></main><script>const bands=[60,170,310,600,1000,2500,5000,10000,16000];const key="pm_eq";const presetKey="pm_eq_preset";const $=id=>document.getElementById(id);function get(){try{const a=JSON.parse(localStorage.getItem(key)||"[]");return a.length===9?a.map(Number):Array(9).fill(0)}catch{return Array(9).fill(0)}}function draw(){const a=get();$("bands").innerHTML=a.map((v,i)=>'<div class="band"><b>'+bands[i]+' Hz</b><br>'+v+' dB</div>').join("");$("status").textContent="Текущий EQ сохранён в браузере. Файл создастся с этими значениями."}$("save").onclick=()=>{const data={app:"Pulse Music",type:"equalizer",version:1,frequencies:bands,gains:get(),preset:localStorage.getItem(presetKey)||"custom",savedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="pulse-music-equalizer.json";a.click();URL.revokeObjectURL(a.href);$("status").textContent="✅ EQ сохранён в pulse-music-equalizer.json"};$("load").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.gains)||d.gains.length!==9)throw Error();const a=d.gains.map(Number);if(a.some(v=>!Number.isFinite(v)||v<-12||v>12))throw Error();localStorage.setItem(key,JSON.stringify(a));localStorage.setItem(presetKey,d.preset||"custom");draw();$("status").textContent="✅ EQ загружен. Открой Pulse Music — настройки применятся."}catch{$("status").textContent="❌ Это не файл эквалайзера Pulse Music."}};r.readAsText(f)};draw();</script></html>
