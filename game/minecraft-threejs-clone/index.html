<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GOLO Minecraft Clone</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.156.1/build/three.module.js"}}
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="crosshair">+</div>
  <div id="topbar"><b>GOLO WORLD</b><span id="coords">0 0 0</span><span id="fps">-- FPS</span></div>
  <div id="hotbar"></div>
  <div id="hint">КЛИК — начать · WASD — ходить · SPACE — прыжок · SHIFT — бег · ЛКМ — ломать · ПКМ — ставить · 1–8 — блоки · ESC — меню</div>
  <div id="menu" class="panel">
    <h1>GOLO WORLD</h1>
    <p>Standalone voxel world</p>
    <button id="start">НАЧАТЬ ИГРУ</button>
    <button id="save">СОХРАНИТЬ</button>
    <button id="load">ЗАГРУЗИТЬ</button>
    <small>Статическая версия: Vite и npm не нужны.</small>
  </div>
  <div id="status"></div>
  <script type="module" src="./scripts/main.js"></script>
</body>
</html>
