<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft.js</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app"></div>
  <div id="info"><div id="info-player-position"></div></div>
  <div id="toolbar-container"><div id="toolbar">
    <img class="toolbar-icon" id="toolbar-1" src="https://raw.githubusercontent.com/dgreenheck/minecraft-threejs-clone/main/public/textures/grass.png">
    <img class="toolbar-icon" id="toolbar-2" src="https://raw.githubusercontent.com/dgreenheck/minecraft-threejs-clone/main/public/textures/dirt.png">
    <img class="toolbar-icon" id="toolbar-3" src="https://raw.githubusercontent.com/dgreenheck/minecraft-threejs-clone/main/public/textures/stone.png">
    <img class="toolbar-icon" id="toolbar-4" src="https://raw.githubusercontent.com/dgreenheck/minecraft-threejs-clone/main/public/textures/coal_ore.png">
    <img class="toolbar-icon" id="toolbar-5" src="https://raw.githubusercontent.com/dgreenheck/minecraft-threejs-clone/main/public/textures/iron_ore.png">
    <img class="toolbar-icon" id="toolbar-6" src="https://raw.githubusercontent.com/dgreenheck/minecraft-threejs-clone/main/public/textures/tree_top.png">
    <img class="toolbar-icon" id="toolbar-7" src="https://raw.githubusercontent.com/dgreenheck/minecraft-threejs-clone/main/public/textures/leaves.png">
    <img class="toolbar-icon" id="toolbar-8" src="https://raw.githubusercontent.com/dgreenheck/minecraft-threejs-clone/main/public/textures/sand.png">
    <img class="toolbar-icon selected" id="toolbar-0" src="https://raw.githubusercontent.com/dgreenheck/minecraft-threejs-clone/main/public/textures/pickaxe.png">
  </div></div>
  <div id="overlay"><div id="instructions">
    <h1>MINECRAFTjs</h1>
    WASD - Move<br>SHIFT - Sprint<br>SPACE - Jump<br>R - Reset Camera<br>U - Toggle UI<br>0 - Pickaxe<br>1-8 - Select Block<br>F1 - Save Game<br>F2 - Load Game<br>F10 - Debug Camera<br><br>
    <h2>PRESS ANY KEY TO START</h2>
  </div></div>
  <div id="status"></div>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.156.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.156.1/examples/jsm/"}}</script>
  <script type="module" src="./scripts/main.js"></script>
</body>
</html>
