<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse Music</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#29205c,#0a0910 55%);color:#fff;font:15px Inter,Arial,sans-serif;display:flex;justify-content:center}.app{width:min(1100px,94vw);padding:35px 0 50px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.logo{font-size:28px;font-weight:800;letter-spacing:-1px}.logo span{color:#a78bfa}.add{background:#a78bfa;border:0;color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer}.add input{display:none}.hero{display:grid;grid-template-columns:280px 1fr;gap:28px;background:rgba(21,18,32,.88);border:1px solid #302943;border-radius:28px;padding:25px;box-shadow:0 20px 70px #0008}.cover{height:280px;border-radius:22px;background:linear-gradient(135deg,#7c3aed,#ec4899 55%,#f59e0b);display:grid;place-items:center;font-size:90px;box-shadow:0 15px 45px #0007}.info{display:flex;flex-direction:column;justify-content:center}.label{color:#9ca3af;font-size:12px;text-transform:uppercase;letter-spacing:2px}.title{font-size:34px;font-weight:800;margin:8px 0}.artist{color:#9ca3af;margin-bottom:24px}.visual{height:170px;background:#0a0810;border:1px solid #292337;border-radius:18px;overflow:hidden}.visual canvas{width:100%;height:100%}.time{display:flex;justify-content:space-between;color:#888;font-size:12px;margin-top:8px}.range{width:100%;accent-color:#a78bfa}.controls{text-align:center;margin:17px 0}.btn{width:46px;height:46px;border:0;border-radius:50%;margin:0 5px;background:#292335;color:white;font-size:18px;cursor:pointer}.main{width:60px;height:60px;background:#a78bfa;font-size:22px}.vol{display:flex;align-items:center;gap:10px;color:#aaa}.vol input{width:140px;accent-color:#a78bfa}.library{margin-top:24px;background:rgba(21,18,32,.75);border:1px solid #302943;border-radius:22px;padding:20px}.libtitle{font-size:18px;font-weight:700;margin-bottom:12px}.song{display:flex;align-items:center;gap:14px;padding:13px;border-radius:13px;cursor:pointer}.song:hover,.song.active{background:#282238}.num{color:#777;width:25px}.songname{font-weight:600;flex:1}.empty{color:#777;padding:15px 0}.youtube{margin-top:18px;display:flex;gap:10px}.youtube input{flex:1;min-width:0;background:#0d0b13;border:1px solid #342d45;color:white;border-radius:12px;padding:13px}.youtube button{background:#ff3355;color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:700;cursor:pointer}.yt{margin-top:15px;display:none}.yt iframe{width:100%;height:315px;border:0;border-radius:16px}@media(max-width:750px){.hero{grid-template-columns:1fr}.cover{height:220px}.title{font-size:26px}.youtube{flex-direction:column}.youtube button{padding:13px}.yt iframe{height:230px}}
</style></head><body><main class="app"><div class="top"><div class="logo">Pulse <span>Music</span></div><label class="add">＋ Добавить треки<input id="files" type="file" accept="audio/*" multiple></label></div><section class="hero"><div class="cover">♫</div><div class="info"><div class="label">Сейчас играет</div><div class="title" id="name">Выбери трек</div><div class="artist">Локальная музыка</div><div class="visual"><canvas id="wave"></canvas></div><input class="range" id="progress" type="range" min="0" max="100" value="0"><div class="time"><span id="cur">0:00</span><span id="total">0:00</span></div><div class="controls"><button class="btn" id="prev">⏮</button><button class="btn main" id="play">▶</button><button class="btn" id="next">⏭</button></div><div class="vol">🔊 <input id="vol" type="range" min="0" max="1" step=".01" value=".8"></div></div></section><section class="library"><div class="libtitle">Моя музыка</div><div id="songs" class="empty">Добавь MP3, WAV или OGG</div><div class="youtube"><input id="yturl" placeholder="Вставь ссылку YouTube"><button id="ytadd">Добавить YouTube</button></div><div id="yt" class="yt"></div></section></main><audio id="audio"></audio><script>
const A=document.getElementById('audio'),F=document.getElementById('files'),L=document.getElementById('songs'),C=document.getElementById('wave'),X=C.getContext('2d');let T=[],I=-1,AC,AN,data;const $=x=>document.getElementById(x),fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
function setup(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();AN=AC.createAnalyser();AN.fftSize=256;AN.smoothingTimeConstant=.55;AN.minDecibels=-90;AN.maxDecibels=-10;data=new Uint8Array(AN.frequencyBinCount);const S=AC.createMediaElementSource(A);S.connect(AN);AN.connect(AC.destination)}
function render(){L.innerHTML='';if(!T.length){L.className='empty';L.textContent='Добавь MP3, WAV или OGG';return}L.className='';T.forEach((t,i)=>{const d=document.createElement('div');d.className='song'+(i===I?' active':'');d.innerHTML='<span class="num">'+String(i+1).padStart(2,'0')+'</span><span class="songname">'+esc(t.name)+'</span><span>▶</span>';d.onclick=()=>play(i);L.appendChild(d)})}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function play(i){setup();if(AC.state==='suspended')AC.resume();I=i;A.src=T[i].url;A.play().catch(()=>{});$('name').textContent=T[i].name;$('play').textContent='❚❚';render()}function toggle(){if(I<0){if(T.length)play(0);return}if(A.paused){setup();if(AC.state==='suspended')AC.resume();A.play();$('play').textContent='❚❚'}else{A.pause();$('play').textContent='▶'}}function step(n){if(T.length)play((I+n+T.length)%T.length)}F.onchange=e=>{[...e.target.files].forEach(f=>T.push({name:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f)}));render()};$('play').onclick=toggle;$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('vol').oninput=e=>A.volume=e.target.value;A.volume=.8;A.ontimeupdate=()=>{if(A.duration)$('progress').value=A.currentTime/A.duration*100;$('cur').textContent=fmt(A.currentTime);$('total').textContent=fmt(A.duration)};A.onended=()=>step(1);$('progress').oninput=e=>{if(A.duration)A.currentTime=e.target.value/100*A.duration};
function resize(){const r=C.getBoundingClientRect(),d=Math.min(devicePixelRatio,2);C.width=r.width*d;C.height=r.height*d;X.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function draw(){requestAnimationFrame(draw);const w=C.clientWidth,h=C.clientHeight;X.clearRect(0,0,w,h);if(!AN||A.paused){X.strokeStyle='#463b5d';X.lineWidth=2;X.beginPath();for(let x=0;x<w;x+=5){let y=h/2+Math.sin(x*.035)*8;X.lineTo(x,y)}X.stroke();return}AN.getByteFrequencyData(data);const bars=72,bw=w/bars;for(let i=0;i<bars;i++){let v=data[Math.floor(i*data.length/bars)]/255;let hh=5+v*(h*.88);let x=i*bw+1;let g=X.createLinearGradient(0,0,0,h);g.addColorStop(0,'#ec4899');g.addColorStop(.5,'#a78bfa');g.addColorStop(1,'#38bdf8');X.fillStyle=g;X.beginPath();X.roundRect(x,(h-hh)/2,Math.max(2,bw-3),hh,4);X.fill()}}draw();
$('ytadd').onclick=()=>{let u=$('yturl').value.trim(),m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{11})/);if(!m){alert('Вставь обычную ссылку YouTube');return}let id=m[1];$('yt').style.display='block';$('yt').innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'?rel=0" title="YouTube player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';};
</script></body></html>
