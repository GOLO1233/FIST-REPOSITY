<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIST Maps — 3D Map + Google Earth</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#101820}#game{position:fixed;inset:0;width:100%;height:100%}.top{position:fixed;z-index:20;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:7px;align-items:center;background:#ffffffed;padding:7px;border-radius:15px;box-shadow:0 5px 25px #0005}.top input{width:230px;border:0;outline:0;background:#f1f3f5;border-radius:10px;padding:10px 12px;font-size:14px}.top button,.mapbtn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer;background:#fff}.top button{background:#1677ff;color:#fff}.earth{background:#202124!important;color:#fff}.hud{position:fixed;z-index:15;left:14px;bottom:14px;color:#fff;background:#111b;padding:12px 15px;border-radius:13px;font-size:13px;line-height:1.5;backdrop-filter:blur(8px)}.hud b{font-size:17px}.cross{position:fixed;z-index:10;left:50%;top:50%;width:12px;height:12px;margin:-6px;border:1px solid #fff;border-radius:50%;pointer-events:none}.mapbox{position:fixed;z-index:30;right:14px;bottom:14px;width:330px;height:230px;border-radius:15px;overflow:hidden;box-shadow:0 8px 35px #0008;border:2px solid #fff}.mapbox.hidden{display:none}#map{width:100%;height:100%}.mapclose{position:absolute;z-index:5;right:8px;top:8px;border:0;background:#111c;color:#fff;border-radius:8px;padding:6px 9px;cursor:pointer}.start{position:fixed;z-index:50;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#071522dd,#071522aa);color:#fff;text-align:center}.panel{max-width:500px;padding:30px;border-radius:22px;background:#111d;box-shadow:0 15px 60px #0008}.panel h1{font-size:32px;margin:0 0 8px}.panel p{opacity:.85;line-height:1.5}.start button{border:0;border-radius:13px;padding:13px 22px;font-size:16px;font-weight:700;cursor:pointer}.hidden{display:none!important}.leaflet-control-attribution{font-size:9px}</style></head><body><canvas id="game"></canvas><div class="top"><input id="city" placeholder="Найти город…" value="Kyiv"><button id="find">🔎 Найти</button><button id="mapToggle">🗺️ Карта</button><button id="earth" class="earth">🌍 Google Earth</button></div><div class="cross"></div><div class="hud"><b>🌍 FIST Maps</b><br>WASD — движение · Shift — бег · Space — прыжок<br>мышь — обзор · M — карта · R — домой · Esc — курсор</div><div id="mapbox" class="mapbox hidden"><button class="mapclose" id="closeMap">✕</button><div id="map"></div></div><div id="start" class="start"><div class="panel"><h1>🌍 FIST Maps</h1><p>Возвращена старая 3D-карта. Теперь сверху есть отдельная кнопка Google Earth для настоящего глобуса, спутниковых снимков, 3D-зданий и Street View.</p><button id="startBtn">Начать</button></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"}}</script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module">import*as THREE from'three';const $=id=>document.getElementById(id);const canvas=$('game');const renderer=new THREE.WebGLRenderer({canvas,antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.2));renderer.setSize(innerWidth,innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0x8dcff0);scene.fog=new THREE.Fog(0x8dcff0,120,600);const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.1,1000);camera.position.set(0,1.7,28);scene.add(new THREE.HemisphereLight(0xeaf6ff,0x39443d,2));const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(100,180,70);scene.add(sun);const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.9});function box(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);scene.add(m);return m}box(720,.2,720,0x69736f,0,-.1,0);for(let x=-300;x<=300;x+=50){box(10,.04,680,0x242629,x,.02,0);box(4,.12,680,0x9b9e99,x-7,.1,0);box(4,.12,680,0x9b9e99,x+7,.1,0)}for(let z=-300;z<=300;z+=50){box(680,.04,10,0x242629,0,.03,z);box(680,.12,4,0x9b9e99,0,.1,z-7);box(680,.12,4,0x9b9e99,0,.1,z+7)}const cols=[0x64727d,0x78858c,0x8c796c,0x56646e,0x747c82,0x947e6d];for(let x=-275;x<=275;x+=25)for(let z=-275;z<=275;z+=25){if(Math.abs(x)%50<13||Math.abs(z)%50<13)continue;const h=9+Math.random()*45,w=15+Math.random()*6,d=15+Math.random()*6;box(w,h,d,cols[Math.random()*cols.length|0],x,h/2,z);for(let yy=5;yy<h;yy+=5)if(Math.random()>.35)box(.15,.5,w*.55,0xc8d7df,x,yy,z-d/2-.03)}for(let x=-300;x<=300;x+=50)for(let z=-300;z<=300;z+=50){box(.22,5,.22,0x303438,x+12,2.5,z+12);const lamp=new THREE.PointLight(0xffe7a2,1.1,20);lamp.position.set(x+12,5,z+12);scene.add(lamp)}box(24,125,24,0x9ba1a7,-75,62.5,-25);box(6,28,6,0x6d7379,-75,139,-25);box(16,4,16,0x4d8063,70,2,-60);box(5,20,5,0x72a083,70,14,-60);let yaw=0,pitch=0,locked=false;const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR'){camera.position.set(0,1.7,28);yaw=0;pitch=0}if(e.code==='KeyM')toggleMap();if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);canvas.onclick=()=>canvas.requestPointerLock();document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===canvas);addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0022;pitch-=e.movementY*.0022;pitch=THREE.MathUtils.clamp(pitch,-1.45,1.45)});$('startBtn').onclick=()=>{$('start').classList.add('hidden');canvas.requestPointerLock()};const map=L.map('map',{zoomControl:true}).setView([50.45,30.52],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);let marker=L.marker([50.45,30.52]).addTo(map).bindPopup('Точка на карте');function toggleMap(){const b=$('mapbox');b.classList.toggle('hidden');if(!b.classList.contains('hidden'))setTimeout(()=>map.invalidateSize(),100)}$('mapToggle').onclick=toggleMap;$('closeMap').onclick=toggleMap;$('earth').onclick=()=>window.open('https://earth.google.com/web/','_blank','noopener');async function findCity(){const q=$('city').value.trim();if(!q)return;try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));const a=await r.json();if(!a[0])return;const lat=+a[0].lat,lon=+a[0].lon;map.setView([lat,lon],14);marker.setLatLng([lat,lon]).bindPopup(a[0].display_name).openPopup();$('mapbox').classList.remove('hidden');setTimeout(()=>map.invalidateSize(),100)}catch(e){console.warn(e)}}$('find').onclick=findCity;$('city').addEventListener('keydown',e=>{if(e.key==='Enter')findCity()});const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;const f=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));const mv=new THREE.Vector3();if(keys.KeyW)mv.add(f);if(keys.KeyS)mv.sub(f);if(keys.KeyD)mv.add(r);if(keys.KeyA)mv.sub(r);if(mv.lengthSq()){mv.normalize().multiplyScalar((keys.ShiftLeft||keys.ShiftRight?10:5)*dt);camera.position.add(mv)}if(keys.Space)camera.position.y=Math.min(80,camera.position.y+20*dt);camera.position.y=Math.max(1.7,camera.position.y-20*dt);camera.position.x=THREE.MathUtils.clamp(camera.position.x,-330,330);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-330,330);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
