<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse Music</title><style>body{margin:0;background:#09090f;color:white;font:15px Arial;padding:30px;text-align:center}h1{font-size:40px}.box{max-width:900px;margin:auto;background:#15151e;border:1px solid #292936;border-radius:22px;padding:25px}.add{background:#9b78ff;color:white;border:0;border-radius:12px;padding:13px 20px;font-weight:bold;cursor:pointer}.add input{display:none}#name{margin:25px 0 10px;font-size:24px;font-weight:bold}.sub{color:#888}canvas{width:100%;height:180px;background:#08080d;border-radius:15px;margin:25px 0}input[type=range]{width:100%;accent-color:#9b78ff}.controls{margin:18px}.btn{border:0;border-radius:50%;width:48px;height:48px;background:#292532;color:white;font-size:20px;margin:5px;cursor:pointer}.play{background:#9b78ff}.songs{margin-top:25px;text-align:left}.song{padding:13px;border-radius:10px;cursor:pointer}.song:hover{background:#211e2b}</style><div class="box"><h1>Pulse Music</h1><label class="add">＋ Добавить музыку<input id="files" type="file" accept="audio/*" multiple></label><div id="name">Выбери трек</div><div class="sub">Волна двигается прямо под музыку</div><canvas id="wave"></canvas><input id="progress" type="range" min="0" max="100" value="0"><div><span id="cur">0:00</span> / <span id="total">0:00</span></div><div class="controls"><button class="btn" id="prev">↶</button><button class="btn play" id="play">▶</button><button class="btn" id="next">↷</button></div><div>🔊 <input id="vol" type="range" min="0" max="1" step=".01" value=".8"></div><div class="songs" id="songs">Музыки пока нет</div></div><audio id="audio"></audio><script>const A=document.getElementById('audio'),F=document.getElementById('files'),L=document.getElementById('songs'),C=document.getElementById('wave'),X=C.getContext('2d');let T=[],I=-1,AC,AN;const $=x=>document.getElementById(x),fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';function setup(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();AN=AC.createAnalyser();AN.fftSize=128;AN.smoothingTimeConstant=.8;let S=AC.createMediaElementSource(A);S.connect(AN);AN.connect(AC.destination)}function render(){L.innerHTML=T.length?'':'Музыки пока нет';T.forEach((t,i)=>{let d=document.createElement('div');d.className='song';d.textContent=(i+1)+'. '+t.name;d.onclick=()=>play(i);L.appendChild(d)})}function play(i){setup();if(AC.state==='suspended')AC.resume();I=i;A.src=T[i].url;A.play();$('name').textContent=T[i].name;$('play').textContent='❚❚';render()}function toggle(){if(I<0){if(T.length)play(0);return}if(A.paused){A.play();$('play').textContent='❚❚'}else{A.pause();$('play').textContent='▶'}}function step(n){if(T.length)play((I+n+T.length)%T.length)}F.onchange=e=>{[...e.target.files].forEach(f=>T.push({name:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f)}));render()};$('play').onclick=toggle;$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('vol').oninput=e=>A.volume=e.target.value;A.volume=.8;A.ontimeupdate=()=>{if(A.duration)$('progress').value=A.currentTime/A.duration*100;$('cur').textContent=fmt(A.currentTime);$('total').textContent=fmt(A.duration)};A.onended=()=>step(1);$('progress').oninput=e=>{if(A.duration)A.currentTime=e.target.value/100*A.duration};function resize(){let r=C.getBoundingClientRect(),d=Math.min(devicePixelRatio,2);C.width=r.width*d;C.height=r.height*d;X.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function draw(){requestAnimationFrame(draw);let w=C.clientWidth,h=C.clientHeight;X.clearRect(0,0,w,h);let data=AN?new Uint8Array(AN.frequencyBinCount):null;AN&&AN.getByteFrequencyData(data);for(let i=0;i<64;i++){let v=data?data[i%data.length]/255:.08;let hh=8+v*(h-30);let x=i*w/64+2;X.fillStyle='#9b78ff';X.beginPath();X.roundRect(x,(h-hh)/2,w/90,hh,4);X.fill()}}draw();</script>
