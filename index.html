<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D City — прогулка по городу</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif}#game{display:block;width:100%;height:100%}.hud{position:fixed;z-index:5;top:14px;left:14px;padding:14px 16px;border-radius:14px;background:#101722dd;color:#fff;line-height:1.45;box-shadow:0 8px 30px #0005}.hud b{font-size:18px}.hud small{display:block;opacity:.8;margin-top:5px}.crosshair{position:fixed;z-index:6;left:50%;top:50%;width:8px;height:8px;margin:-4px;border:1px solid white;border-radius:50%;pointer-events:none}.start{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:#06111dbb;color:#fff;text-align:center}.panel{padding:28px;border-radius:20px;background:#111d;max-width:440px}.panel h1{margin:0 0 10px}.btn,.mode{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer}.btn{font-size:16px}.mode{position:fixed;z-index:7;right:14px;top:14px;background:#111d;color:#fff}.hidden{display:none}</style></head><body><canvas id="game"></canvas><div class="hud"><b>🏙️ 3D City</b><small>WASD — ходьба · Shift — бег · Space — прыжок<br>мышь — обзор · R — сброс позиции · Esc — освободить мышь</small></div><button id="mode" class="mode">✈️ Полёт</button><div class="crosshair"></div><div id="start" class="start"><div class="panel"><h1>🏙️ Свободная прогулка</h1><p>Кликни «Начать», захвати мышь и гуляй по улицам города от первого лица.</p><button id="startBtn" class="btn">Начать прогулку</button></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"}}</script><script type="module">import*as THREE from'three';const canvas=document.getElementById('game'),renderer=new THREE.WebGLRenderer({canvas,antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.setSize(innerWidth,innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bcff2);scene.fog=new THREE.Fog(0x8bcff2,140,520);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,900);camera.position.set(0,1.7,30);scene.add(new THREE.HemisphereLight(0xeaf5ff,0x34403b,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(100,180,80);scene.add(sun);const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.9});function addBox(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);scene.add(m);return m}const ground=addBox(700,.2,700,0x65706b,0,-.1,0);for(let x=-300;x<=300;x+=50){addBox(9,.04,650,0x24272a,x,.02,0);addBox(4,.12,650,0x9b9e99,x-7,.1,0);addBox(4,.12,650,0x9b9e99,x+7,.1,0)}for(let z=-300;z<=300;z+=50){addBox(650,.04,9,0x24272a,0,.03,z);addBox(650,.12,4,0x9b9e99,0,.1,z-7);addBox(650,.12,4,0x9b9e99,0,.1,z+7)}const colors=[0x687481,0x7d8790,0x8b786b,0x59656f,0x727b82,0x927f70];const buildings=[];for(let x=-275;x<=275;x+=25)for(let z=-275;z<=275;z+=25){if(Math.abs(x)%50<13||Math.abs(z)%50<13)continue;const h=10+Math.random()*48,w=15+Math.random()*5,d=15+Math.random()*5;const b=addBox(w,h,d,colors[Math.random()*colors.length|0],x,h/2,z);buildings.push({x,z,w,d,h})}for(let x=-300;x<=300;x+=50)for(let z=-300;z<=300;z+=50){addBox(.25,4.5,.25,0x33363a,x+12,2.25,z+12);const l=new THREE.PointLight(0xffe9a8,1.2,18);l.position.set(x+12,4.5,z+12);scene.add(l)}const tower=addBox(20,130,20,0x9aa0a5,-75,65,-25);addBox(5,30,5,0x72777c,-75,145,-25);addBox(12,4,12,0x567d65,70,2,-60);addBox(4,18,4,0x75a58e,70,13,-60);let flying=true,locked=false,yaw=0,pitch=0,vy=0;const keys={};document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR'){camera.position.set(0,1.7,30);vy=0}if(e.code==='Space')e.preventDefault()});document.addEventListener('keyup',e=>keys[e.code]=false);canvas.addEventListener('click',()=>canvas.requestPointerLock());document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===canvas);document.addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0022;pitch-=e.movementY*.0022;pitch=THREE.MathUtils.clamp(pitch,-1.45,1.45)});function updateMode(){document.getElementById('mode').textContent=flying?'✈️ Полёт':'🚶 Ходьба'}document.getElementById('mode').onclick=()=>{flying=!flying;if(!flying){camera.position.y=1.7;vy=0}updateMode()};document.getElementById('startBtn').onclick=()=>{document.getElementById('start').classList.add('hidden');canvas.requestPointerLock()};updateMode();const clock=new THREE.Clock();const radius=.7;function blocked(p){for(const b of buildings){if(Math.abs(p.x-b.x)<b.w/2+radius&&Math.abs(p.z-b.z)<b.d/2+radius)return true}return false}function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;const forward=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)*-1),right=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));let mv=new THREE.Vector3();if(keys.KeyW)mv.add(forward);if(keys.KeyS)mv.sub(forward);if(keys.KeyD)mv.add(right);if(keys.KeyA)mv.sub(right);if(mv.lengthSq())mv.normalize().multiplyScalar((flying?42:(keys.ShiftLeft||keys.ShiftRight?10:5))*dt);const nx=camera.position.clone();nx.x+=mv.x;if(!blocked(nx))camera.position.x=nx.x;const nz=camera.position.clone();nz.z+=mv.z;if(!blocked(nz))camera.position.z=nz.z;if(flying){if(keys.Space)camera.position.y+=42*dt;if(keys.ShiftLeft||keys.ShiftRight)camera.position.y-=42*dt;camera.position.y=Math.max(1.7,camera.position.y)}else{if(keys.Space&&camera.position.y<=1.71)vy=7.5;vy-=20*dt;camera.position.y+=vy*dt;if(camera.position.y<1.7){camera.position.y=1.7;vy=0}}camera.position.x=THREE.MathUtils.clamp(camera.position.x,-325,325);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-325,325);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
