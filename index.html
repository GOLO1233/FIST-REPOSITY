<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Нью-Йорк — свободная прогулка</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif}#game{display:block;width:100%;height:100%}.hud{position:fixed;z-index:5;top:14px;left:14px;padding:14px 16px;border-radius:14px;background:rgba(10,15,25,.86);color:#fff;box-shadow:0 8px 30px #0005;line-height:1.5}.hud b{font-size:18px}.hud small{display:block;opacity:.78;margin-top:5px}.crosshair{position:fixed;z-index:6;left:50%;top:50%;width:10px;height:10px;margin:-5px;border:1px solid #fff;border-radius:50%;box-shadow:0 0 4px #000;pointer-events:none}.start{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#06111dcc,#06111d99);color:#fff;text-align:center}.panel{padding:28px;border-radius:20px;background:#111a;backdrop-filter:blur(10px);max-width:430px}.panel h1{margin:0 0 10px;font-size:30px}.panel p{opacity:.85}.btn{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:700;cursor:pointer;background:#fff;color:#111}.mode{position:fixed;z-index:7;right:14px;top:14px;padding:10px 13px;border:0;border-radius:12px;background:#111d;color:#fff;cursor:pointer}.hidden{display:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><b>🗽 3D Нью-Йорк</b><small>WASD — движение · мышь — обзор<br>Space — лететь вверх · Shift — вниз<br>R — вернуться на землю · Esc — отпустить мышь</small></div>
<button id="mode" class="mode">✈️ Полёт</button>
<div class="crosshair"></div>
<div id="start" class="start"><div class="panel"><h1>🏙️ Свободный город</h1><p>Ходи по улицам или включи полёт и летай над городом.</p><button id="startBtn" class="btn">Начать</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bcff2);scene.fog=new THREE.Fog(0x8bcff2,180,650);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,1000);camera.position.set(0,5,35);
scene.add(new THREE.HemisphereLight(0xddeeff,0x445566,2.2));
const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(80,160,80);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(700,700),new THREE.MeshStandardMaterial({color:0x59635f,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function box(w,h,d,color,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.8,metalness:.05}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
// Streets
for(let x=-300;x<=300;x+=50)box(8,.08,650,0x24282b,x,.05,0);
for(let z=-300;z<=300;z+=50)box(650,.08,8,0x24282b,0,.06,z);
// Sidewalks
for(let x=-300;x<=300;x+=50){box(5,.16,650,0x969b98,x-6,.1,0);box(5,.16,650,0x969b98,x+6,.1,0)}
for(let z=-300;z<=300;z+=50){box(650,.16,5,0x969b98,0,.1,z-6);box(650,.16,5,0x969b98,0,.1,z+6)}
// Buildings: deliberately lightweight so the site works on weaker PCs.
const colors=[0x657080,0x7b8794,0x8d7868,0x59636d,0x6c747d,0x927f70,0x596b78];
for(let x=-275;x<=275;x+=25){for(let z=-275;z<=275;z+=25){if(Math.abs(x)%50<12||Math.abs(z)%50<12)continue;const h=12+Math.random()*55;const w=15+Math.random()*6;const d=15+Math.random()*6;box(w,h,d,colors[Math.floor(Math.random()*colors.length)],x,h/2,z);if(Math.random()>.45){for(let yy=7;yy<h-3;yy+=7){box(w+.02,.55,.08,0xb8d6df,x,yy,z-d/2-.05);box(w+.02,.55,.08,0xb8d6df,x,yy,z+d/2+.05)}}}}
// Landmark-style tower
const tower=box(22,145,22,0x9aa0a5,-75,72.5,-25);tower.add(box(5,30,5,0x73787c,-75,160,-25));
// Statue-ish landmark
const base=box(10,4,10,0x567d65,70,2,-60);const statue=new THREE.Mesh(new THREE.CylinderGeometry(2.5,4,18,10),new THREE.MeshStandardMaterial({color:0x74a58f}));statue.position.set(70,13,-60);statue.castShadow=true;scene.add(statue);
// Simple street lights
for(let x=-300;x<=300;x+=50)for(let z=-300;z<=300;z+=50){if((Math.abs(x)%100===0)&&(Math.abs(z)%100===0)){box(.25,5,.25,0x303338,x+12,2.5,z+12);const l=new THREE.Mesh(new THREE.SphereGeometry(.55,8,8),new THREE.MeshStandardMaterial({color:0xffffcc,emissive:0x444400}));l.position.set(x+12,5.2,z+12);scene.add(l)}}
let flying=true;let locked=false;let yaw=0,pitch=0;const keys={};const speed={walk:24,fly:55};
document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ShiftLeft','ShiftRight'].includes(e.code))e.preventDefault();if(e.code==='KeyR'){camera.position.y=5;flying=false;updateMode()}});document.addEventListener('keyup',e=>keys[e.code]=false);
canvas.addEventListener('click',()=>canvas.requestPointerLock());document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===canvas);document.addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0022;pitch-=e.movementY*.0022;pitch=Math.max(-1.45,Math.min(1.45,pitch))});
function updateMode(){document.getElementById('mode').textContent=flying?'✈️ Полёт':'🚶 Ходьба'}
document.getElementById('mode').onclick=()=>{flying=!flying;if(!flying&&camera.position.y<2)camera.position.y=2;updateMode()};
document.getElementById('startBtn').onclick=()=>{document.getElementById('start').classList.add('hidden');canvas.requestPointerLock()};
updateMode();
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;const dir=new THREE.Vector3();camera.getWorldDirection(dir);dir.y=0;dir.normalize();const right=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,1,0)).normalize();let move=new THREE.Vector3();if(keys.KeyW)move.add(dir);if(keys.KeyS)move.sub(dir);if(keys.KeyD)move.add(right);if(keys.KeyA)move.sub(right);if(move.lengthSq())move.normalize().multiplyScalar((flying?speed.fly:speed.walk)*dt);camera.position.add(move);if(flying){if(keys.Space)camera.position.y+=speed.fly*dt;if(keys.ShiftLeft||keys.ShiftRight)camera.position.y-=speed.fly*dt;camera.position.y=Math.max(2,camera.position.y)}else{camera.position.y=5}camera.position.x=THREE.MathUtils.clamp(camera.position.x,-325,325);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-325,325);renderer.render(scene,camera)}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
