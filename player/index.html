<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#06070b;color:#f7f5ff}body{overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer}.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(800px 600px at 10% -10%,#35206b 0,transparent 60%),radial-gradient(700px 500px at 100% 100%,#0b3550 0,transparent 60%),#06070b}.shell{display:grid;grid-template-columns:240px 1fr;max-width:1600px;min-height:100vh;margin:auto}.side{position:sticky;top:0;height:100vh;padding:26px 15px;background:#0b0c12c9;border-right:1px solid #ffffff10;backdrop-filter:blur(24px)}.logo{font-size:25px;font-weight:900;padding:8px 13px 30px}.logo span{color:#a78bfa}.nav{display:grid;gap:6px}.nav button{border:1px solid transparent;background:transparent;color:#9994a8;text-align:left;border-radius:13px;padding:12px 14px;transition:.2s}.nav button:hover,.nav button.active{background:#8b5cf620;color:#fff}.main{padding:25px 30px 115px;min-width:0}.top{display:flex;gap:10px;position:sticky;top:12px;z-index:15;margin-bottom:24px;padding:6px;border-radius:18px;background:#06070b99;backdrop-filter:blur(20px)}.search{flex:1}.search input{width:100%;height:46px;padding:0 17px;border:1px solid #ffffff10;border-radius:14px;background:#12131bcc;color:#fff;outline:0}.add,.primary{border:0;border-radius:13px;padding:0 17px;color:#fff;font-weight:800;background:linear-gradient(135deg,#8b5cf6,#6d28d9)}.view{display:none}.view.active{display:block}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.head h1{margin:0;font-size:34px}.muted{color:#9690a3}.ghost{border:1px solid #ffffff12;background:#12131bcc;color:#ddd;border-radius:11px;padding:9px 12px}.hero{display:grid;grid-template-columns:minmax(240px,360px) 1fr;gap:30px;padding:28px;border:1px solid #ffffff10;border-radius:30px;background:linear-gradient(145deg,#161421dd,#0d0e14cc);box-shadow:0 30px 100px #0007}.cover{aspect-ratio:1;border-radius:25px;display:grid;place-items:center;font-size:105px;font-weight:900;background:linear-gradient(135deg,#5b21b6,#c026d3 55%,#f59e0b);box-shadow:0 28px 70px #7c3aed40}.cover.play{animation:pulse 2.8s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.025)}}.details{display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:11px;letter-spacing:2px;color:#b5aec3}.title{font-size:clamp(28px,4vw,50px);font-weight:900;letter-spacing:-2px;margin:5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{color:#a7a1b2;margin-bottom:18px}.visual{height:200px;border-radius:18px;border:1px solid #ffffff0b;background:#05060a;overflow:hidden}.visual canvas{width:100%;height:100%}.range,.volume input{accent-color:#a78bfa}.range{width:100%}.times{display:flex;justify-content:space-between;color:#777;font-size:12px}.controls{display:flex;justify-content:center;gap:10px;margin:16px 0}.round{width:44px;height:44px;border:1px solid #ffffff10;border-radius:50%;background:#ffffff08;color:#fff}.round.big{width:62px;height:62px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);border:0;font-size:20px}.extras{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.volume{display:flex;align-items:center;gap:8px;min-width:250px}.volume input{flex:1}.section{margin-top:30px}.section h2{font-size:19px}.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px}.row:hover,.row.active{background:#ffffff08}.rname{flex:1;min-width:0}.rname b,.rname span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rname span{font-size:12px;color:#817b8e}.heart{border:0;background:none;color:#777;font-size:20px}.heart.on{color:#f472b6}.empty{padding:30px;text-align:center;color:#777;border:1px dashed #ffffff16;border-radius:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.setting{padding:16px;border:1px solid #ffffff10;background:#12131acc;border-radius:16px}.stat b{display:block;font-size:30px;margin-top:6px}.setting{margin:9px 0}.settingLine{display:flex;justify-content:space-between;align-items:center;gap:15px}.setting select{background:#11121a;color:#ddd;border:1px solid #ffffff14;border-radius:10px;padding:8px}.eq{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;padding:15px;border:1px solid #ffffff10;background:#08090e;border-radius:16px}.band{text-align:center;color:#aaa;font-size:11px}.band input{appearance:slider-vertical;width:30px;height:145px;accent-color:#a78bfa;display:block;margin:8px auto}.mini{position:fixed;left:260px;right:25px;bottom:17px;z-index:20;display:flex;align-items:center;gap:11px;padding:11px 15px;border:1px solid #ffffff12;border-radius:17px;background:#11121add;backdrop-filter:blur(22px)}.miniCover{width:43px;height:43px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#ec4899)}.miniName{flex:1;min-width:0}.miniName b,.miniName span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.miniName span{font-size:12px;color:#858090}.toast{position:fixed;right:20px;top:20px;z-index:50;padding:12px 16px;border-radius:12px;background:#1b1824;border:1px solid #a78bfa40;opacity:0;transform:translateY(-12px);transition:.2s}.toast.show{opacity:1;transform:none}.drop{display:none;position:fixed;inset:18px;z-index:40;place-items:center;border:3px dashed #a78bfa;border-radius:25px;background:#0b0c12ee;font-size:24px}.drop.show{display:grid}body.light{background:#f3f4f8;color:#16151b}.light .side,.light .mini,.light .setting,.light .stat,.light .hero{background:#ffffffd9;color:#16151b}.light .search input,.light .ghost,.light .setting select{background:#fff;color:#222}@media(max-width:850px){.shell{display:block}.side{position:fixed;z-index:30;bottom:0;left:0;right:0;top:auto;height:auto;padding:7px;border:0;border-top:1px solid #ffffff12}.logo{display:none}.nav{display:flex;justify-content:space-around}.nav button{font-size:11px;text-align:center;padding:8px}.main{padding:15px 13px 95px}.hero{grid-template-columns:1fr;padding:18px}.cover{width:min(350px,100%);margin:auto}.mini{left:10px;right:10px;bottom:61px}.stats{grid-template-columns:1fr 1fr}.eq{grid-template-columns:repeat(9,minmax(28px,1fr));overflow:auto}}
</style></head><body><div class="bg"></div><aside class="side"><div class="logo">Pulse <span>Music</span></div><nav class="nav"><button class="active" data-view="home">⌂ Главная</button><button data-view="music">♫ Моя музыка</button><button data-view="favorites">♥ Любимые</button><button data-view="stats">◉ Статистика</button><button data-view="settings">⚙ Настройки</button></nav></aside><main class="main"><header class="top"><div class="search"><input id="search" placeholder="Поиск по названию..."></div><label class="add">＋ Добавить<input id="files" type="file" accept="audio/*" multiple hidden></label></header><section id="home" class="view active"><div class="head"><div><h1>Сейчас играет</h1><div class="muted">Локальная музыка • без сервера</div></div></div><div class="hero"><div class="cover" id="cover">♫</div><div class="details"><div class="eyebrow">NOW PLAYING</div><div class="title" id="title">Выбери трек</div><div class="artist" id="artist">Pulse Music</div><div class="visual"><canvas id="canvas"></canvas></div><input id="progress" class="range" type="range" min="0" max="100" value="0"><div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div><div class="controls"><button class="round" id="prev">⏮</button><button class="round" id="shuffle">🔀</button><button class="round big" id="play">▶</button><button class="round" id="repeat">↻</button><button class="round" id="next">⏭</button></div><div class="extras"><div class="volume">🔊<input id="volume" type="range" min="0" max="1" step=".01" value=".8"><span id="volValue">80%</span><button class="ghost" id="mute">Mute</button></div><select id="speed" class="setting"><option value=".5">0.5x</option><option value=".75">0.75x</option><option selected value="1">1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option></select></div></div></div><div class="section"><h2>Недавно добавленные</h2><div id="recent"></div></div></section><section id="music" class="view"><div class="head"><h1>Моя музыка</h1></div><div id="musicList"></div></section><section id="favorites" class="view"><div class="head"><h1>Любимые</h1></div><div id="favList"></div></section><section id="stats" class="view"><div class="head"><h1>Статистика</h1></div><div class="stats"><div class="stat">Треков<b id="stTracks">0</b></div><div class="stat">Минут<b id="stMinutes">0</b></div><div class="stat">Запусков<b id="stPlays">0</b></div><div class="stat">Любимых<b id="stFav">0</b></div></div></section><section id="settings" class="view"><div class="head"><h1>Настройки</h1></div><div class="setting"><div class="settingLine"><span>Тема</span><select id="theme"><option>Dark</option><option>Light</option></select></div></div><div class="setting"><div class="settingLine"><span>Визуализатор</span><select id="mode"><option value="wave">Wave</option><option value="bars">Bars</option><option value="circle">Circle</option></select></div></div><div class="section"><h2>Equalizer — 9 полос</h2><div id="eq" class="eq"></div></div></section></main><div class="mini"><div class="miniCover">♫</div><div class="miniName"><b id="miniTitle">Ничего не играет</b><span id="miniArtist">—</span></div><button class="round" id="miniPrev">⏮</button><button class="round" id="miniPlay">▶</button><button class="round" id="miniNext">⏭</button><button class="heart" id="miniFav">♡</button></div><div id="drop" class="drop">🎵 Перетащи музыку сюда</div><div id="toast" class="toast"></div><audio id="audio"></audio><script>
const $=id=>document.getElementById(id),audio=$("audio"),canvas=$("canvas"),ctx=canvas.getContext("2d");let tracks=[],current=-1,shuffle=false,repeat=false,query="",favorites=[],plays=0,seconds=0,mode=localStorage.getItem("pm_mode")||"wave",audioCtx,source,analyser,filters=[];const freqs=[60,170,310,600,1000,2500,5000,10000,16000];
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1600)}function fmt(s){return isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00"}function esc(s){return String(s).replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))}function save(){localStorage.setItem("pm_favorites",JSON.stringify(favorites));localStorage.setItem("pm_plays",plays);localStorage.setItem("pm_seconds",seconds);localStorage.setItem("pm_mode",mode);localStorage.setItem("pm_volume",audio.volume)}function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v))}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));function setupAudio(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();source=audioCtx.createMediaElementSource(audio);filters=freqs.map((f,i)=>{let n=audioCtx.createBiquadFilter();n.type=i===0?'lowshelf':i===freqs.length-1?'highshelf':'peaking';n.frequency.value=f;n.Q.value=.9;return n});analyser=audioCtx.createAnalyser();analyser.fftSize=512;let n=source;filters.forEach(f=>{n.connect(f);n=f});n.connect(analyser);analyser.connect(audioCtx.destination)}function renderEQ(){let box=$("eq");box.innerHTML='';freqs.forEach((f,i)=>{let d=document.createElement('div');d.className='band';d.innerHTML='<b>'+f+'Hz</b><input type="range" min="-12" max="12" value="0"><div>0 dB</div>';let r=d.querySelector('input'),v=d.querySelector('div');r.oninput=()=>{setupAudio();filters[i].gain.value=+r.value;v.textContent=r.value+' dB'};box.appendChild(d)})}function addFiles(list){[...list].filter(f=>f.type.startsWith('audio/')).forEach(f=>tracks.push({name:f.name.replace(/\.[^.]+$/,''),artist:'Локальная музыка',url:URL.createObjectURL(f)}));render();toast('Добавлено: '+list.length)}function row(t,i){let on=favorites.includes(i);return '<div class="row '+(i===current?'active':'')+'" data-i="'+i+'"><div class="rname"><b>'+esc(t.name)+'</b><span>'+esc(t.artist)+'</span></div><button class="heart '+(on?'on':'')+'" data-fav="'+i+'">'+(on?'♥':'♡')+'</button></div>'}function render(){let arr=tracks.map((t,i)=>({t,i})).filter(x=>(x.t.name+' '+x.t.artist).toLowerCase().includes(query.toLowerCase()));$("musicList").innerHTML=arr.length?arr.map(x=>row(x.t,x.i)).join(''):'<div class="empty">Добавь музыку</div>';$('recent').innerHTML=tracks.slice(-5).reverse().map((t,j)=>row(t,tracks.length-1-j)).join('')||'<div class="empty">Пока пусто</div>';$('favList').innerHTML=favorites.map(i=>tracks[i]?row(tracks[i],i):'').join('')||'<div class="empty">Пока нет любимых</div>';$('stTracks').textContent=tracks.length;$('stMinutes').textContent=Math.floor(seconds/60);$('stPlays').textContent=plays;$('stFav').textContent=favorites.length;document.querySelectorAll('[data-i]').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-fav]'))return;playTrack(+x.dataset.i)});document.querySelectorAll('[data-fav]').forEach(x=>x.onclick=e=>{e.stopPropagation();toggleFav(+x.dataset.fav)})}function toggleFav(i){let p=favorites.indexOf(i);p<0?favorites.push(i):favorites.splice(p,1);save();render()}function playTrack(i){if(!tracks[i])return;current=i;setupAudio();audioCtx.resume();audio.src=tracks[i].url;audio.playbackRate=parseFloat($("speed").value);audio.play();plays++;save();update();render()}function update(){let t=tracks[current];$('title').textContent=t?.name||'Выбери трек';$('artist').textContent=t?.artist||'Pulse Music';$('miniTitle').textContent=t?.name||'Ничего не играет';$('miniArtist').textContent=t?.artist||'—';$('cover').textContent=t?.name?.[0]?.toUpperCase()||'♫';$('play').textContent=audio.paused?'▶':'⏸';$('miniPlay').textContent=audio.paused?'▶':'⏸';$('cover').classList.toggle('play',!audio.paused);$('miniFav').textContent=current>=0&&favorites.includes(current)?'♥':'♡'}function next(){if(!tracks.length)return;let i=shuffle?Math.floor(Math.random()*tracks.length):current+1;if(i>=tracks.length)i=0;playTrack(i)}function prev(){if(audio.currentTime>4){audio.currentTime=0;return}let i=current-1;if(i<0)i=tracks.length-1;playTrack(i)}$("files").onchange=e=>addFiles(e.target.files);document.addEventListener('dragover',e=>{e.preventDefault();$('drop').classList.add('show')});document.addEventListener('drop',e=>{e.preventDefault();$('drop').classList.remove('show');addFiles(e.dataTransfer.files)});$("play").onclick=()=>{if(!tracks.length)return toast('Сначала добавь музыку');if(current<0)return playTrack(0);setupAudio();audioCtx.resume();audio.paused?audio.play():audio.pause()};$("miniPlay").onclick=()=>$("play").click();$("next").onclick=next;$("miniNext").onclick=next;$("prev").onclick=prev;$("miniPrev").onclick=prev;$("shuffle").onclick=()=>shuffle=!shuffle;$("repeat").onclick=()=>repeat=!repeat;$("miniFav").onclick=()=>current>=0&&toggleFav(current);audio.onplay=update;audio.onpause=update;audio.ontimeupdate=()=>{$('progress').value=audio.duration?audio.currentTime/audio.duration*100:0;$('cur').textContent=fmt(audio.currentTime);$('dur').textContent=fmt(audio.duration);seconds+=.25};audio.onended=()=>repeat?playTrack(current):next();$('progress').oninput=()=>audio.duration&&(audio.currentTime=audio.duration*$('progress').value/100);$('volume').oninput=e=>{audio.volume=+e.target.value;$('volValue').textContent=Math.round(audio.volume*100)+'%';save()};$('mute').onclick=()=>{audio.volume=audio.volume?0:.8;$('volume').value=audio.volume;$('volume').dispatchEvent(new Event('input'))};$('speed').onchange=()=>audio.playbackRate=parseFloat($('speed').value);$('search').oninput=e=>{query=e.target.value;render()};$('mode').onchange=e=>{mode=e.target.value;save()};$('theme').onchange=e=>document.body.classList.toggle('light',e.target.value==='Light');function resize(){let r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}window.onresize=resize;function draw(){requestAnimationFrame(draw);resize();let w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#05060a';ctx.fillRect(0,0,w,h);if(!analyser||audio.paused){ctx.strokeStyle='#2a2536';ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();return}let a=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(a);ctx.fillStyle='#a78bfa';if(mode==='bars'){for(let i=0;i<50;i++){let v=a[Math.floor(i*a.length/50)]/255;ctx.fillRect(i*w/50+2,h-v*h,w/50-4,v*h)}}else if(mode==='circle'){let c=Math.min(w,h)/4;for(let i=0;i<80;i++){let v=a[i%a.length]/255,t=i/80*Math.PI*2,r=c+v*c;ctx.beginPath();ctx.moveTo(w/2+Math.cos(t)*c,h/2+Math.sin(t)*c);ctx.lineTo(w/2+Math.cos(t)*r,h/2+Math.sin(t)*r);ctx.strokeStyle='#c026d3';ctx.stroke()}}else{let data=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(data);ctx.beginPath();ctx.strokeStyle='#a78bfa';for(let i=0;i<data.length;i++){let x=i/data.length*w,y=h/2+(data[i]-128)*h*.004;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}}draw();favorites=JSON.parse(localStorage.getItem('pm_favorites')||'[]');plays=+(localStorage.getItem('pm_plays')||0);seconds=+(localStorage.getItem('pm_seconds')||0);audio.volume=+(localStorage.getItem('pm_volume')??.8);$('volume').value=audio.volume;$('volValue').textContent=Math.round(audio.volume*100)+'%';$('mode').value=mode;renderEQ();render();update();
</script></body></html>
